<div class="stage">
  <aside class="intro" aria-label="Demo 說明">
    <div class="intro-brand">
      <svg class="mark" aria-hidden="true"><use href="#ill-mark"></use></svg>
      <div>
        <p class="intro-kicker">LINE MINI App 買家端示意</p>
        <h1 class="intro-title">售後共享車<br><span>Share Repair</span></h1>
      </div>
    </div>
    <p class="intro-lede">商家共享一套海外售後能力。買家只需要一個 LINE 入口、一位平台窗口、一份看得懂的案件。</p>
    <ol class="intro-tiers">
      <li><b>免費查詢</b>台灣是否有可處理的據點</li>
      <li><b>免費排查</b>依手冊一步一步試，能解決就結束</li>
      <li><b>專人處理</b>收費前先說清楚，寄件前再確認一次</li>
    </ol>
    <section class="intro-scenes" aria-labelledby="scenes-title">
      <h2 id="scenes-title">從這裡跳到展示情境</h2>
      <div class="scene-grid" id="scene-grid"></div>
    </section>
    <p class="intro-foot">本機靜態原型：品牌、型號、據點、窗口與金額均為虛構示範；不登入、不收款、不寄送通知、不保存資料。</p>
  </aside>

  <div class="device">
    <div class="app" id="app">
      <header class="mini-head">
        <div class="mini-title">
          <span class="mini-name">售後共享車 Share Repair <span class="demo-pill">DEMO</span></span>
          <span class="mini-domain">share-repair.example・標頭示意</span>
        </div>
        <div class="mini-actions" role="group" aria-label="MINI App 動作按鈕（示意）">
          <button type="button" class="mini-btn" id="btn-more" aria-label="更多選項" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-more"></use></svg></button>
          <span class="mini-sep" aria-hidden="true"></span>
          <button type="button" class="mini-btn" id="btn-close" aria-label="關閉（示意）"><svg class="ic" aria-hidden="true"><use href="#i-close"></use></svg></button>
        </div>
      </header>
      <main id="screen" class="screen" tabindex="-1"></main>
      <nav class="tabbar" aria-label="主選單">
        <button type="button" class="tab" data-tab="home"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg><span>首頁</span></button>
        <button type="button" class="tab" data-tab="cases"><svg class="ic" aria-hidden="true"><use href="#i-cases"></use></svg><span>我的案件</span><span class="tab-badge" id="tab-badge" hidden></span></button>
        <button type="button" class="tab" data-tab="about"><svg class="ic" aria-hidden="true"><use href="#i-info"></use></svg><span>服務說明</span></button>
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="sheet-backdrop" id="sheet" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <p class="sheet-title" id="sheet-title">更多選項</p>
          <button type="button" class="sheet-item" data-sheet="share"><svg class="ic" aria-hidden="true"><use href="#i-share"></use></svg>分享給朋友</button>
          <button type="button" class="sheet-item" data-sheet="about"><svg class="ic" aria-hidden="true"><use href="#i-info"></use></svg>服務說明</button>
          <button type="button" class="sheet-item" data-sheet="reset"><svg class="ic" aria-hidden="true"><use href="#i-reset"></use></svg>重設 Demo</button>
          <button type="button" class="sheet-item sheet-cancel" data-sheet="cancel">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

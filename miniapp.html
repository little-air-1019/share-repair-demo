<!doctype html>
<html lang="zh-Hant" data-liff-env="published">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>售後共享車 Share Repair</title>
<meta name="description" content="售後共享車 Share Repair 第一版客戶介面（互動情境展示：案件、金額與窗口回覆皆為情境資料）">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Local icon + illustration sprite. Line icons use a 1.5px stroke to match LINE's icon weight; no LINE assets are copied. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H14.5v-5.5h-5V20H4z"/></symbol>
    <symbol id="i-cases" viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="15.5" rx="2"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 15h4.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m19.5 19.5-4.6-4.6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M14.5 4.5a4.5 4.5 0 0 0-4.2 6.1L4.5 16.4V19.5h3.1l5.8-5.8a4.5 4.5 0 0 0 6.1-4.2l-2.7 1-2.2-.8-.8-2.2z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.4 4.6 3 17.4A1.8 1.8 0 0 0 4.6 20h14.8a1.8 1.8 0 0 0 1.6-2.6L13.6 4.6a1.8 1.8 0 0 0-3.2 0z"/><path d="M12 9.5v4.5M12 17v.1"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.3-3.5-8.5S9.7 5.9 12 3.5z"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6.5h10.5v9.5H3zM13.5 9.5h4l3 3.2V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 4.5-7.5 7.5 7.5 7.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8h4L9 5.5h6L16.5 8h4v11.5h-17z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6.3V12c0 4.2-3 7.3-7 8.5-4-1.2-7-4.3-7-8.5V6.3z"/><path d="m9 12 2.2 2.2 4-4.3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4.5H9"/></symbol>
    <symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>

    <!-- Product illustrations (fictional products), flat gray with one green accent -->
    <symbol id="ill-console" viewBox="0 0 120 120">
      <rect x="14" y="36" width="92" height="50" rx="12" fill="var(--ill-soft)" stroke="var(--ill-dark)" stroke-width="2.5"/>
      <rect x="38" y="44" width="44" height="34" rx="4" fill="var(--ill-dark)"/>
      <rect x="42" y="48" width="36" height="26" rx="2" fill="var(--ill-accent)" fill-opacity=".85"/>
      <path d="M24 61h8M28 57v8" stroke="var(--ill-dark)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="94" cy="55" r="3.5" fill="var(--ill-dark)"/>
      <circle cx="88" cy="66" r="3.5" fill="var(--ill-dark)"/>
    </symbol>
    <symbol id="ill-dryer" viewBox="0 0 120 120">
      <path d="M22 30h56a20 20 0 0 1 0 40H22z" fill="var(--ill-soft)" stroke="var(--ill-dark)" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="10" y="36" width="14" height="28" rx="3" fill="var(--ill-dark)"/>
      <circle cx="74" cy="50" r="10" fill="none" stroke="var(--ill-dark)" stroke-opacity=".3" stroke-width="3"/>
      <path d="M58 70h18l-6 38a4 4 0 0 1-4 3h-4a4 4 0 0 1-4-3z" fill="var(--ill-accent)"/>
      <path d="M100 42h10M100 50h14M100 58h10" stroke="var(--ill-dark)" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="ill-buds" viewBox="0 0 120 120">
      <rect x="27" y="58" width="66" height="46" rx="20" fill="var(--ill-soft)" stroke="var(--ill-dark)" stroke-width="2.5"/>
      <path d="M27 76h66" stroke="var(--ill-dark)" stroke-opacity=".2" stroke-width="1.5"/>
      <circle cx="60" cy="92" r="2.5" fill="var(--ill-accent)"/>
      <g fill="var(--ill-accent)">
        <path d="M38 18c9 0 14 7 13 15s-6 11-9 11v14a4 4 0 0 1-8 0V34c-3-1-6-5-5-9 1-4 4-7 9-7z"/>
        <path d="M82 18c-9 0-14 7-13 15s6 11 9 11v14a4 4 0 0 0 8 0V34c3-1 6-5 5-9-1-4-4-7-9-7z"/>
      </g>
      <circle cx="40" cy="30" r="5" fill="var(--ill-dark)"/>
      <circle cx="80" cy="30" r="5" fill="var(--ill-dark)"/>
    </symbol>
    <symbol id="ill-receipt" viewBox="0 0 120 120">
      <path d="M34 12h52v96l-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5z" fill="#fff" stroke="var(--ill-dark)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M44 30h32M44 42h22M44 54h28M44 66h18" stroke="var(--ill-dark)" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
      <path d="M44 84h32" stroke="var(--ill-accent)" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <!-- Product mark: wrench inside a loop. Original drawing, not the LINE logo. -->
    <symbol id="ill-mark" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="7" fill="var(--green)"/>
      <path d="M9.5 19.5a7 7 0 0 1 11.6-8.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22.5 12.5a7 7 0 0 1-11.6 8.2" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="21.6" cy="10.8" r="1.8" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<div class="app" id="app">
  <div class="preview-notice" role="note">
    <span class="preview-label">展示版本</span>
    <span class="preview-text">情境資料・示範金額</span>
    <button type="button" class="preview-btn" id="btn-tools" data-act="tools" aria-haspopup="dialog">展示工具</button>
  </div>
  <main id="screen" class="screen" tabindex="-1"></main>
  <nav class="bnav" aria-label="主選單">
    <button type="button" class="bnav-item" data-tab="home" data-act="tab-home"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg><span>首頁</span></button>
    <button type="button" class="bnav-item" data-tab="cases" data-act="tab-cases"><span class="bnav-icon"><svg class="ic" aria-hidden="true"><use href="#i-cases"></use></svg><span class="bnav-badge" id="bnav-badge" aria-hidden="true" hidden></span></span><span aria-hidden="true">維修案件</span><span class="sr-only" id="bnav-cases-label">維修案件</span></button>
    <button type="button" class="bnav-item" data-tab="about" data-act="tab-about"><svg class="ic" aria-hidden="true"><use href="#i-info"></use></svg><span>服務說明</span></button>
  </nav>
  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
  <div class="sheet-dim" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheet-title">展示工具</h2>
        <button type="button" class="icon-btn sheet-close" data-act="sheet-close" aria-label="關閉展示工具"><svg class="ic" aria-hidden="true"><use href="#i-close"></use></svg></button>
      </div>
      <p class="sheet-desc">供展示時直接切換情境。所有操作只在本機畫面中模擬，不會送出資料。</p>
      <ul class="list" id="scene-list"></ul>
      <div class="sheet-foot">
        <button type="button" class="btn btn-outline" id="btn-reset" data-act="reset"><svg class="ic" aria-hidden="true"><use href="#i-reset"></use></svg>重設展示資料</button>
      </div>
    </div>
  </div>
</div>
<div class="liff-gate" id="liff-gate" role="status" aria-live="polite" data-state="loading"><div class="liff-gate-box"><h1 class="liff-gate-title">正在連接 LINE…</h1><p>請稍候。內容與金額皆為示範，不會實際付款。</p></div></div>
<script src="liff-boot.js"></script>
</body>
</html>
